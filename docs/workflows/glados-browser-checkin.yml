# Copy this file to .github/workflows/glados-browser-checkin.yml
# in a NEW PRIVATE repository. Do not attach a self-hosted runner to the
# existing public fork bb955/GLaDOS_checkin.
name: GLaDOS Browser Check-in (Mac)

on:
  workflow_dispatch:
  schedule:
    # UTC 10:17 = Beijing/Taipei 18:17. GitHub may delay scheduled runs.
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: glados-browser-checkin
  cancel-in-progress: false

jobs:
  checkin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Unit tests (no account access)
        run: python -m unittest discover -s tests -v
      - name: Open official GLaDOS page and check in
        run: python browser_checkin.py
