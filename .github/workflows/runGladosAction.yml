name: GLaDOS Daily Check-in (Rewritten)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'status = only verify login; checkin = request actual daily check-in'
        required: true
        default: checkin
        type: choice
        options:
          - checkin
          - status
  schedule:
    # UTC 10:17 = Beijing/Taipei 18:17. GitHub does not guarantee on-time delivery.
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (no account access)
        run: python -m unittest discover -s tests -v
      - name: Account status or real check-in
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT || vars.GLADOS_USER_AGENT || secrets.GLADOS_UA }}
          CHECKIN_MODE: ${{ inputs.mode || 'checkin' }}
        run: python checkin.py --mode "$CHECKIN_MODE"
