name: GLaDOS Cloud Status Check

on:
  workflow_dispatch:
  schedule:
    # UTC 10:17 = Beijing/Taipei 18:17. GitHub does not guarantee on-time delivery.
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: glados-cloud-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (no account access)
        run: python -m unittest discover -s tests -v
      - name: Verify account session only (no check-in request)
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: python checkin.py --mode status
