name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 10:17（北京时间 18:17），减少整点调度拥堵
    - cron: '17 10 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          pip install requests
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run checkin
        run: |
          python3 glados.py
        env:
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          GLADOS_USER_AGENT: "${{ secrets.GLADOS_USER_AGENT || vars.GLADOS_USER_AGENT || secrets.GLADOS_UA }}"
          GLADOS_ORIGIN: "${{ vars.GLADOS_ORIGIN }}"
      #- uses: gh-workflow-keepalive/releases@v1.2.1
