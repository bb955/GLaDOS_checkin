name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 10:00（北京时间 18:00），保留现有签到时间
    - cron: '0 10 * * *'
  # 标星时触发工作流程
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env:
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          GLADOS_UA: "${{ secrets.GLADOS_UA }}"
          GLADOS_ORIGIN: "${{ vars.GLADOS_ORIGIN }}"
      #- uses: gh-workflow-keepalive/releases@v1.2.1
