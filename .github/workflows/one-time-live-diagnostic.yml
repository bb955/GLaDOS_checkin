name: One-time GLaDOS live diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-live-diagnostic.yml

permissions:
  contents: read

jobs:
  live-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Live status and single real check-in request
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT || vars.GLADOS_USER_AGENT || secrets.GLADOS_UA }}
        run: |
          python - <<'PY'
          from checkin import Settings, api_json, classify_checkin, STATUS_URL, CHECKIN_URL, ORIGIN, CheckinError
          import requests, sys
          try:
              settings = Settings.from_env()
              headers = {
                  "Cookie": settings.cookie,
                  "Origin": ORIGIN,
                  "Referer": f"{ORIGIN}/console/checkin",
                  "Content-Type": "application/json;charset=UTF-8",
              }
              if settings.user_agent:
                  headers["User-Agent"] = settings.user_agent
                  print("已配置登录浏览器 User-Agent")
              else:
                  print("未配置 GLADOS_USER_AGENT：将使用 requests 自身标识进行单次诊断，不伪装浏览器")
              with requests.Session() as session:
                  status = api_json(session, "GET", STATUS_URL, headers)
                  if str(status.get("code")) != "0" or not isinstance(status.get("data"), dict):
                      raise CheckinError("Cookie 账号验证未通过，未发送签到请求")
                  print("已有 Cookie 账号状态验证成功")
                  result = api_json(session, "POST", CHECKIN_URL, headers, json={"token": "glados.cloud"})
                  print("服务端返回签到 code:", str(result.get("code", "missing"))[:10])
                  print("签到结果:", classify_checkin(result))
          except CheckinError as exc:
              print("::error::真实签到尚未成功："+str(exc), file=sys.stderr)
              sys.exit(1)
          PY
